[package]
name = "clarabel_c"
version = "0.1.0"
edition = "2021"

[dependencies]
clarabel = "0.11.1"
paste = "1.0"
serde = { version = "1", optional = true }
cfg-if = "1.0"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[features]
default = ["clarabel/sdp"]
sdp = []
serde = ["dep:serde"]
